services:
  postgres:
    ports:
      - "5433:5432"
    environment:
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  app:
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      LOGGING_LEVEL_COM_DELIVERY: DEBUG
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK: INFO
      LOGGING_LEVEL_ORG_HIBERNATE: INFO
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    stdin_open: true
    tty: true

